[project]
name            = "{{project_name}}"
version         = "0.1.0"
description     = "{{project_description}}"
readme          = "README.md"
authors         = [{ name = "{{author}}" }, ]
requires-python = ">=3.15"
dependencies    = []

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest-cov~=6.0.0",
  "poethepoet~=0.32.1",
  "prek~=0.5.7",
  "pytest~=8.3.4",
  "ruff~=0.9.3",
  "ty~=0.0.91",
]

[tool.poe.tasks]
test              = "pytest --cov"
lint_check        = "ruff check --fix"
lint_format       = "ruff format"
lock_check        = "uv lock --check"
type_check        = "ty check"
check_doc         = "python -m doctest -v README.md"
_check            = [
	"lint_check",
	"lint_format",
	"lock_check",
	"check_doc",
	"test",
	"type_check",
]
check.sequence    = ["_check"]
check.ignore_fail = true

build = [
  { ref = "_check" },
  { cmd = "uv build" },
  { cmd = "uv run --with {{project_name}} --no-project -- python -c \"import {{project_name}}\"" },
]


# Approximate a strict type-checking policy; ty has no strictness-mode switch.
[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.ruff]
line-length = 120
output-format = "grouped"
include = [".github/*.py", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
preview = true # Enables future not-yet-official rules.
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "BLE",
  "C901",
  "D101",
  "D102",
  "D103",
  "D200",
  "D205",
  "D403",
  "D405",
  "D415",
  "D417",
  "D419",
  "C4",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "F",
  "FURB",
  "I",
  "N",
  "PD",
  "PERF",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
  "TD",
]
ignore = [
  "PLC0415",
  "PLC1901",
  "PLR6301",
  "SIM300",
  "TD002",
  "EM101",
  "EM102",
]

[tool.ruff.lint.isort]
known-first-party = ["{{project_name}}", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ANN",
  "ARG001",
  "ARG002",
  "B018",
  "PLC2701",
  "PLR2004",
  "PLR0904",
  "PLR0913",
  "PLR0917",
  "RUF018",
  "S101",
  "N801",
  "D",
]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true
suppress-dummy-args = true
allow-star-arg-any = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.params.Depends",
  "fastapi.Query",
  "fastapi.params.Query",
]

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = ["trace"]

[tool.ruff.lint.pylint]
max-args = 7
allow-dunder-method-names = ["__pydantic_init_subclass__"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"
